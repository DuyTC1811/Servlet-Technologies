services:
  postgres:
    image: postgres:16-alpine
    container_name: rbac-abac-postgres
    environment:
      POSTGRES_DB: rbac_abac
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d rbac_abac"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rbac-abac-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/rbac_abac
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: app
      JWT_SECRET: c2VjcmV0LWtleS1mb3ItcmJhYy1hYmFjLXN5c3RlbS1taW5pbXVtLTI1Ni1iaXRz
      JWT_EXPIRATION_MS: 3600000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rbac-abac-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  postgres_data:
